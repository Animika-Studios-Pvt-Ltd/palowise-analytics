name: Palowise Cloud Sync (OneDrive to Supabase)

on:
  schedule:
    # Runs hourly at minute 0 UTC (24/7)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform dry-run only (read-only simulation; no database writes)'
        required: true
        type: boolean
        default: true
      force_sync:
        description: 'Force sync regardless of SHA-256 state'
        required: false
        type: boolean
        default: false

# Prevent concurrent sync runs from colliding
concurrency:
  group: palowise-cloud-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync OneDrive to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Synchronization
        env:
          # OneDrive Sharing Link
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}

          # Supabase Cloud Database Credentials
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DATABASE: ${{ secrets.SUPABASE_DATABASE }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_SSLMODE: 'require'
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled executions run live with SHA-256 change detection (skips if unchanged)
            ARGS="--live"
          else
            # Manual workflow_dispatch honors user-specified inputs
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="--dry-run"
            else
              ARGS="--live"
            fi
            if [ "${{ inputs.force_sync }}" = "true" ]; then
              ARGS="$ARGS --force"
            fi
          fi
          python cloud_sync_excel_to_supabase.py $ARGS
